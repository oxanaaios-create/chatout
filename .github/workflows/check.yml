name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Design system, site, plan
        run: npm run check
      - name: Tokens are up to date
        run: git diff --exit-code visual/tokens.css site/styles/tokens.css || (echo "Run npm run tokens and commit the result" && exit 1)
